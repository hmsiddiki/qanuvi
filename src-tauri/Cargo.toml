[package]
name = "qanuvi"
version = "0.1.44"
description = "A light, agent-first project handler and personal assistant"
authors = ["Inner IT"]
edition = "2024"
default-run = "qanuvi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qanuvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The desktop app with its window. Without it, only the master without a window is built (for a Linux server).
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:keyring", "dep:tauri-plugin-process", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-deep-link", "dep:windows", "dep:notify-rust", "dep:tray-icon", "dep:tao", "dep:png", "dep:arboard"]

[[bin]]
name = "qanuvi"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "qanuvi-master"
path = "src/bin/qanuvi-master.rs"

[[bin]]
name = "qanuvi-relay"
path = "src/bin/qanuvi-relay.rs"

[[bin]]
name = "qanuvi-knowledge"
path = "src/bin/qanuvi-knowledge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
globset = "0.4"
ignore = "0.4.34"
regex = "1.13.1"
portable-pty = "0.9.0"
tauri-plugin-dialog = { version = "2.8.4", optional = true }
uuid = { version = "1.29.2", features = ["v4"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# 24rl R1: the relay server runs every link as a small task instead of a thread.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# 24rl R2: the relay's own TLS port (ring, as tungstenite's client side already uses).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# Relay kit K1: a relay with no domain makes its own certificate (apps check it by the pin in its address).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# 24rl R4: the relay listens with a deep queue (a crowd coming back after a restart).
socket2 = "0.6.5"
base64 = "0.23.1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# sl1 S4: long lines over the relay go packed (the same deflate the zip crate already brings).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.11.1"
minisign-verify = "0.3"
spake2 = "0.4.0"
hkdf = "0.13.0"
ed25519-dalek = "2"
trash = "5"
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
# This PC's master shows a tray icon while it runs (migration M4c); the same versions Tauri uses.
tray-icon = { version = "0.25", optional = true }
tao = { version = "0.37", optional = true }
png = { version = "0.18", optional = true }
# lx1: a copied screen capture the web view does not hand over on a paste (WebKitGTK on Linux).
arboard = { version = "3", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

# Desktop notifications (24u part 4 session B): Windows toasts are built here (own app id, qanuvi:// launch).
[target."cfg(windows)".dependencies.windows]
version = "0.62"
features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = { version = "4", optional = true }
