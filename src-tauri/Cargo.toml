[package]
name = "qanuvi"
version = "0.1.15"
description = "A light, agent-first project handler and personal assistant"
authors = ["Inner IT"]
edition = "2024"
default-run = "qanuvi"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qanuvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The desktop app with its window. Without it, only the master without a window is built (for a Linux server).
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:keyring", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[[bin]]
name = "qanuvi"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "qanuvi-master"
path = "src/bin/qanuvi-master.rs"

[[bin]]
name = "qanuvi-relay"
path = "src/bin/qanuvi-relay.rs"

[[bin]]
name = "qanuvi-knowledge"
path = "src/bin/qanuvi-knowledge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
globset = "0.4"
ignore = "0.4.34"
regex = "1.13.1"
portable-pty = "0.9.0"
tauri-plugin-dialog = { version = "2.8.4", optional = true }
uuid = { version = "1.29.2", features = ["v4"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.23.1"
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
ureq = "3"
sha2 = "0.11.1"
spake2 = "0.4.0"
hkdf = "0.13.0"
ed25519-dalek = "2"
trash = "5"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
