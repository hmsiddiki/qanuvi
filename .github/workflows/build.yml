name: Build

# Builds and tests Qanuvi on Windows, Linux and macOS for every push and pull request.
on:
  push:
    # Plan and documentation edits do not need a build (and must not cancel one that is running).
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux libraries for Tauri
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Checks and tests
        # A test that hangs fails within minutes with its name, instead of holding the runner for an hour.
        timeout-minutes: 30
        env:
          RUST_TEST_TIME_UNIT: "60000,300000"
        run: npm run verify

      - name: Build the app
        run: npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: qanuvi-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
